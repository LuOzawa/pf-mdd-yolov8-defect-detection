# PF-MDD Dataset Configuration for YOLOv8
# Plastic Film Multi-class Defect Detection (4096x256)

# 注意：本文件是数据集配置的「元数据快照」，path 使用相对占位值。
# 实际训练时 project_config.ensure_dataset_yaml() 会把 path 改写为
# 当前工作区的绝对路径，因此本文件不需要手工维护。

# Dataset paths
path: .
train: images/train
val: images/val
test: images/test

# Number of defect classes
nc: 12

# Class names (contiguous YOLO indices mapped from raw defect IDs)
names:
  0: type_002
  1: type_006
  2: type_010
  3: type_016
  4: type_019
  5: type_022
  6: type_023
  7: type_025
  8: type_027
  9: type_029
  10: type_030
  11: type_036

